function countryReinsuranceHTML(key) {
  const mkt = CTX.country_data?.[key]?.market?.metrics || {};
  const n   = CTX.metadata?.country_meta?.[key]?.name || key;
  return `
  <div class="card mb-20">
    <div class="card-title">Reinsurance — ${n}</div>
    <div class="grid-kpi">
      <div class="kpi-card"><div class="kpi-label">GWP</div><div class="kpi-value">${fmt.usd(mkt.gwp_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Ceded Premiums</div><div class="kpi-value">${fmt.usd(mkt.ceded_premiums_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Net Retained</div><div class="kpi-value">${fmt.usd(mkt.net_premiums_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Retention Rate</div><div class="kpi-value">${fmt.pct(mkt.retention_rate)}</div><div class="kpi-sub">% of GWP kept</div></div>
      <div class="kpi-card"><div class="kpi-label">Cession Rate</div><div class="kpi-value">${fmt.pct(mkt.cession_rate)}</div><div class="kpi-sub">% of GWP ceded</div></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-title">GWP: Retained vs. Ceded (USD MM)</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_reinsPremium"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Retention &amp; Cession Rate Trend</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_reinsRetention"></canvas></div>
    </div>
  </div>`;
}

function countryReinsuranceCharts(key) {
  const hist  = CTX.country_data?.[key]?.annual_history || [];
  const years = hist.map(h => h.year);
  const color = countryColor(key);

  const gwp      = hist.map(h => h.market?.metrics?.gwp_usd_mm ?? null);
  const ceded    = hist.map(h => h.market?.metrics?.ceded_premiums_usd_mm ?? null);
  const retained = hist.map((h, i) => {
    const g = gwp[i]; const c = ceded[i];
    return (g != null && c != null) ? g - c : (g ?? null);
  });
  const retRate = hist.map(h => { const v = h.market?.metrics?.retention_rate; return v != null ? v * 100 : null; });
  const cesRate = hist.map(h => { const v = h.market?.metrics?.cession_rate;   return v != null ? v * 100 : null; });

  const el1 = document.getElementById('ch_reinsPremium');
  if (el1) storeChart('reinsPremium', new Chart(el1, {
    type: 'bar',
    data: {
      labels: years,
      datasets: [
        { label:'Net Retained', data:retained, backgroundColor:color+'aa', borderColor:color,     borderWidth:1, borderRadius:[0,0,4,4], stack:'p' },
        { label:'Ceded to RI',  data:ceded,    backgroundColor:'#f0b84d99', borderColor:'#f0b84d', borderWidth:1, borderRadius:[4,4,0,0], stack:'p' }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ stacked:true, grid:{display:false}, ticks:tickOpts },
        y:{ stacked:true, grid:gridOpts, ticks:tickOpts }
      }
    }
  }));

  const el2 = document.getElementById('ch_reinsRetention');
  if (el2) storeChart('reinsRetention', new Chart(el2, {
    type: 'line',
    data: {
      labels: years,
      datasets: [
        { label:'Retention Rate %', data:retRate, borderColor:color,      backgroundColor:color+'22', fill:true,  tension:.3, pointRadius:4, spanGaps:true },
        { label:'Cession Rate %',   data:cesRate, borderColor:'#f0b84d', backgroundColor:'transparent',           tension:.3, pointRadius:4, borderDash:[4,3], spanGaps:true }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ grid:{display:false}, ticks:tickOpts },
        y:{ grid:gridOpts, ticks:{ ...tickOpts, callback:v=>v+'%' }, suggestedMin:50, suggestedMax:100 }
      }
    }
  }));
}

/* ═══════════════════════════════════════════════════════════════
   ██  COUNTRY TAB 9: Expense Anatomy
   Acquisition cost, admin expense, combined ratio decomposition
═══════════════════════════════════════════════════════════════ */
function countryExpenseHTML(key) {
  const mkt  = CTX.country_data?.[key]?.market?.metrics || {};
  const n    = CTX.metadata?.country_meta?.[key]?.name || key;
  const acqR = mkt.net_acq_cost_ratio ?? mkt.commission_ratio;
  return `
  <div class="card mb-20">
    <div class="card-title">Expense Anatomy — ${n}</div>
    <div class="grid-kpi">
      <div class="kpi-card"><div class="kpi-label">Acquisition Ratio</div><div class="kpi-value">${fmt.pct(acqR)}</div><div class="kpi-sub">% of net premiums</div></div>
      <div class="kpi-card"><div class="kpi-label">Admin Expense Ratio</div><div class="kpi-value">${fmt.pct(mkt.admin_expense_ratio)}</div><div class="kpi-sub">% of net premiums</div></div>
      <div class="kpi-card"><div class="kpi-label">Loss Ratio</div><div class="kpi-value">${fmt.pct(mkt.loss_ratio_gross)}</div><div class="kpi-sub">Claims / GWP</div></div>
      <div class="kpi-card"><div class="kpi-label">Combined Ratio</div><div class="kpi-value">${fmt.pct(mkt.combined_ratio_gross)}</div><div class="kpi-sub">Loss + Acq + Admin</div></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-title">Combined Ratio Decomposition (% Net Retained Premiums)</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_expRatios"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Acquisition &amp; Admin Costs (USD MM)</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_expAmounts"></canvas></div>
    </div>
  </div>`;
}

function countryExpenseCharts(key) {
  const hist  = CTX.country_data?.[key]?.annual_history || [];
  const years = hist.map(h => h.year);

  const lossR = hist.map(h => { const v = h.market?.metrics?.loss_ratio_gross;   return v != null ? v * 100 : null; });
  const acqR  = hist.map(h => { const m = h.market?.metrics; const v = m?.net_acq_cost_ratio ?? m?.commission_ratio; return v != null ? v * 100 : null; });
  const admR  = hist.map(h => { const v = h.market?.metrics?.admin_expense_ratio; return v != null ? v * 100 : null; });
  const combR = hist.map(h => { const v = h.market?.metrics?.combined_ratio_gross;return v != null ? v * 100 : null; });

  const el1 = document.getElementById('ch_expRatios');
  if (el1) storeChart('expRatios', new Chart(el1, {
    type: 'bar',
    data: {
      labels: years,
      datasets: [
        { type:'bar',  label:'Loss Ratio',        data:lossR, backgroundColor:'#ff5f6788', borderColor:'#ff5f67', borderWidth:1, borderRadius:[0,0,4,4], stack:'x' },
        { type:'bar',  label:'Acquisition Ratio', data:acqR,  backgroundColor:'#f0b84d88', borderColor:'#f0b84d', borderWidth:1, stack:'x' },
        { type:'bar',  label:'Admin Ratio',        data:admR,  backgroundColor:'#8b7cff88', borderColor:'#8b7cff', borderWidth:1, borderRadius:[4,4,0,0], stack:'x' },
        { type:'line', label:'Combined Ratio',     data:combR, borderColor:'#343A40', backgroundColor:'transparent', tension:.3, pointRadius:3, borderWidth:2, spanGaps:true }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ stacked:true, grid:{display:false}, ticks:tickOpts },
        y:{ stacked:true, grid:gridOpts, ticks:{ ...tickOpts, callback:v=>v+'%' } }
      }
    }
  }));

  const nrp   = hist.map(h => h.market?.metrics?.net_premiums_usd_mm ?? null);
  const acqAmt = hist.map((h, i) => { const m = h.market?.metrics; const r = m?.net_acq_cost_ratio ?? m?.commission_ratio; const n = nrp[i]; return (r != null && n != null) ? r * n : null; });
  const admAmt = hist.map((h, i) => { const r = h.market?.metrics?.admin_expense_ratio; const n = nrp[i]; return (r != null && n != null) ? r * n : null; });

  const el2 = document.getElementById('ch_expAmounts');
  if (el2) storeChart('expAmounts', new Chart(el2, {
    type: 'bar',
    data: {
      labels: years,
      datasets: [
        { label:'Acquisition Costs', data:acqAmt, backgroundColor:'#f0b84dcc', borderColor:'#f0b84d', borderWidth:1, borderRadius:[0,0,4,4], stack:'e' },
        { label:'Admin Expenses',    data:admAmt, backgroundColor:'#8b7cffcc', borderColor:'#8b7cff', borderWidth:1, borderRadius:[4,4,0,0], stack:'e' }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ stacked:true, grid:{display:false}, ticks:tickOpts },
        y:{ stacked:true, grid:gridOpts, ticks:tickOpts }
      }
    }
  }));
}

/* ═══════════════════════════════════════════════════════════════
   ██  COUNTRY TAB 10: Reserves & Solvency
   Technical reserves, equity, leverage, reserves-to-premiums
═══════════════════════════════════════════════════════════════ */
function countryReservesHTML(key) {
  const mkt = CTX.country_data?.[key]?.market?.metrics || {};
  const n   = CTX.metadata?.country_meta?.[key]?.name || key;
  return `
  <div class="card mb-20">
    <div class="card-title">Reserves &amp; Solvency — ${n}</div>
    <div class="grid-kpi">
      <div class="kpi-card"><div class="kpi-label">Technical Reserves</div><div class="kpi-value">${fmt.usd(mkt.technical_reserves_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Shareholders' Equity</div><div class="kpi-value">${fmt.usd(mkt.equity_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Total Investments</div><div class="kpi-value">${fmt.usd(mkt.total_investments_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Reserves / GWP</div><div class="kpi-value">${fmt.mult(mkt.reserves_to_premiums)}</div><div class="kpi-sub">times</div></div>
      <div class="kpi-card"><div class="kpi-label">Asset Leverage</div><div class="kpi-value">${fmt.mult(mkt.asset_leverage)}</div><div class="kpi-sub">Assets / Equity</div></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-title">Balance Sheet Trend (USD MM)</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_bsTrend"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Asset Leverage &amp; Reserves / GWP</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_leverage"></canvas></div>
    </div>
  </div>`;
}

function countryReservesCharts(key) {
  const hist    = CTX.country_data?.[key]?.annual_history || [];
  const years   = hist.map(h => h.year);
  const color   = countryColor(key);

  const reserves = hist.map(h => h.market?.metrics?.technical_reserves_usd_mm ?? null);
  const equity   = hist.map(h => h.market?.metrics?.equity_usd_mm ?? null);
  const invest   = hist.map(h => h.market?.metrics?.total_investments_usd_mm ?? null);
  const leverage = hist.map(h => h.market?.metrics?.asset_leverage ?? null);
  const resvGwp  = hist.map(h => h.market?.metrics?.reserves_to_premiums ?? null);

  const el1 = document.getElementById('ch_bsTrend');
  if (el1) storeChart('bsTrend', new Chart(el1, {
    type: 'line',
    data: {
      labels: years,
      datasets: [
        { label:'Technical Reserves',  data:reserves, borderColor:'#58a6ff', backgroundColor:'#58a6ff22', fill:true, tension:.3, pointRadius:4, spanGaps:true },
        { label:"Shareholders' Equity",data:equity,   borderColor:color,     backgroundColor:'transparent', tension:.3, pointRadius:4, spanGaps:true },
        { label:'Total Investments',   data:invest,   borderColor:'#40d19b', backgroundColor:'transparent', borderDash:[5,3], tension:.3, pointRadius:3, spanGaps:true }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ grid:{display:false}, ticks:tickOpts },
        y:{ grid:gridOpts, ticks:tickOpts }
      }
    }
  }));

  const el2 = document.getElementById('ch_leverage');
  if (el2) storeChart('leverage', new Chart(el2, {
    type: 'bar',
    data: {
      labels: years,
      datasets: [
        { type:'bar',  label:'Asset Leverage (x)',  data:leverage, backgroundColor:color+'88', borderColor:color,     borderWidth:1, borderRadius:4, yAxisID:'yLev'  },
        { type:'line', label:'Reserves / GWP (x)',  data:resvGwp,  borderColor:'#f0b84d',     backgroundColor:'transparent', tension:.3, pointRadius:4, spanGaps:true, yAxisID:'yRGwp' }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ grid:{display:false}, ticks:tickOpts },
        yLev:  { grid:gridOpts,       ticks:{ ...tickOpts, callback:v=>v+'x' }, position:'left'  },
        yRGwp: { grid:{display:false},ticks:{ ...tickOpts, callback:v=>v+'x' }, position:'right' }
      }
    }
  }));
}

/* ═══════════════════════════════════════════════════════════════
   ██  COUNTRY TAB 11: Financial Result
   Technical + financial result composition, ROE & margin trend
═══════════════════════════════════════════════════════════════ */
function countryFinancialHTML(key) {
  const mkt = CTX.country_data?.[key]?.market?.metrics || {};
  const n   = CTX.metadata?.country_meta?.[key]?.name || key;
  return `
  <div class="card mb-20">
    <div class="card-title">Financial Result &amp; Profitability — ${n}</div>
    <div class="grid-kpi">
      <div class="kpi-card"><div class="kpi-label">Technical Result</div><div class="kpi-value">${fmt.usd(mkt.technical_result_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Financial Result</div><div class="kpi-value">${fmt.usd(mkt.financial_result_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">Net Income</div><div class="kpi-value">${fmt.usd(mkt.net_income_usd_mm)}</div><div class="kpi-sub">USD MM</div></div>
      <div class="kpi-card"><div class="kpi-label">ROE</div><div class="kpi-value">${fmt.pct(mkt.roe)}</div><div class="kpi-sub">Net Income / Equity</div></div>
      <div class="kpi-card"><div class="kpi-label">Technical Margin</div><div class="kpi-value">${fmt.pct(mkt.technical_margin)}</div><div class="kpi-sub">Tech Result / GWP</div></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-title">P&amp;L Components (USD MM)</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_plComponents"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">ROE &amp; Technical Margin Trend</div>
      <div class="chart-wrap" style="height:260px"><canvas id="ch_roeTrend2"></canvas></div>
    </div>
  </div>`;
}

function countryFinancialCharts(key) {
  const hist  = CTX.country_data?.[key]?.annual_history || [];
  const years = hist.map(h => h.year);
  const color = countryColor(key);

  const techRes  = hist.map(h => h.market?.metrics?.technical_result_usd_mm ?? null);
  const finRes   = hist.map(h => h.market?.metrics?.financial_result_usd_mm ?? null);
  const netInc   = hist.map(h => h.market?.metrics?.net_income_usd_mm ?? null);
  const roe      = hist.map(h => { const v = h.market?.metrics?.roe;              return v != null ? v * 100 : null; });
  const techMarg = hist.map(h => { const v = h.market?.metrics?.technical_margin; return v != null ? v * 100 : null; });

  const el1 = document.getElementById('ch_plComponents');
  if (el1) storeChart('plComponents', new Chart(el1, {
    type: 'bar',
    data: {
      labels: years,
      datasets: [
        { type:'bar',  label:'Technical Result',
          data: techRes,
          backgroundColor: techRes.map(v => (v||0)>=0 ? '#40d19b99' : '#ff5f6799'),
          borderColor:     techRes.map(v => (v||0)>=0 ? '#40d19b'   : '#ff5f67'),
          borderWidth:1, borderRadius:[0,0,4,4] },
        { type:'bar',  label:'Financial Result',
          data: finRes,
          backgroundColor: finRes.map(v => (v||0)>=0 ? '#58a6ff88' : '#f0b84d88'),
          borderColor:     finRes.map(v => (v||0)>=0 ? '#58a6ff'   : '#f0b84d'),
          borderWidth:1, borderRadius:[4,4,0,0] },
        { type:'line', label:'Net Income',
          data: netInc,
          borderColor:'#343A40', backgroundColor:'transparent',
          tension:.3, pointRadius:5, borderWidth:2.5, spanGaps:true }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ grid:{display:false}, ticks:tickOpts },
        y:{ grid:gridOpts, ticks:tickOpts }
      }
    }
  }));

  const el2 = document.getElementById('ch_roeTrend2');
  if (el2) storeChart('roeTrend2', new Chart(el2, {
    type: 'line',
    data: {
      labels: years,
      datasets: [
        { label:'ROE %',              data:roe,       borderColor:color,    backgroundColor:color+'22', fill:true, tension:.3, pointRadius:4, spanGaps:true },
        { label:'Technical Margin %', data:techMarg, borderColor:'#40d19b', backgroundColor:'transparent', tension:.3, pointRadius:4, borderDash:[4,3], spanGaps:true }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } },
      scales:{
        x:{ grid:{display:false}, ticks:tickOpts },
        y:{ grid:gridOpts, ticks:{ ...tickOpts, callback:v=>v+'%' } }
      }
    }
  }));
}
